name: Validate font collection
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_release.py
      - run: python -m compileall -q skills scripts font-sources
      - run: python scripts/install_skills.py --dry-run --dest /tmp/pally-skills-test
